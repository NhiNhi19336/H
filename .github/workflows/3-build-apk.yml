name: 3 - Build APK
on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Tên zip, vd game.zip"
        required: true
      app_name:
        description: "Tên app"
        required: true
      app_id:
        description: "Package ID, vd com.nheo.game"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Giải nén web
        run: |
          mkdir tmp && unzip -q "${{ inputs.zip }}" -d tmp
          SRC=$(dirname "$(find tmp -name index.html -not -path '*/node_modules/*' | head -1)")
          mkdir -p app/www && cp -r "$SRC"/. app/www/

      - name: Bọc bằng Capacitor
        working-directory: app
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "${{ inputs.app_name }}" "${{ inputs.app_id }}" --web-dir www
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease

      - name: Ký APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          $BT/zipalign -f -p 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias upload \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out app.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app.apk
