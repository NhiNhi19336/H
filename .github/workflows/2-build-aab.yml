name: 2 - Build AAB
on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Đường dẫn zip, vd zips/game.zip"
        required: true
      app_name:
        description: "Tên app"
        required: true
      app_id:
        description: "Package ID, vd com.nheo.game"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Giải nén web
        run: |
          mkdir tmp && unzip -q "${{ inputs.zip }}" -d tmp
          SRC=$(dirname "$(find tmp -name index.html -not -path '*/node_modules/*' | head -1)")
          mkdir -p app/www && cp -r "$SRC"/. app/www/

      - name: Bọc bằng Capacitor
        working-directory: app
        run: |
          npm init -y
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap init "${{ inputs.app_name }}" "${{ inputs.app_id }}" --web-dir www
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/' android/variables.gradle

      - name: Build AAB
        working-directory: app/android
        run: ./gradlew bundleRelease

      - name: Ký AAB
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          jarsigner -keystore release.jks \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            app/android/app/build/outputs/bundle/release/app-release.aab upload

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
