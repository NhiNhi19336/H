name: 2 - Build AAB

on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Đường dẫn zip, vd zips/game.zip"
        required: true
      app_name:
        description: "Tên app"
        required: true
      app_id:
        description: "Package ID, vd com.nheo.game"
        required: true
      version_name:
        description: "Tên phiên bản, vd 1.2.0"
        required: true
        default: "1.0"
      version_code:
        description: "Mã phiên bản (để trống = tự tăng)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Giải nén web
        run: |
          mkdir tmp && unzip -q "${{ inputs.zip }}" -d tmp
          SRC=$(dirname "$(find tmp -name index.html -not -path '*/node_modules/*' | head -1)")
          mkdir -p app/www && cp -r "$SRC"/. app/www/

      - name: Bọc bằng Capacitor
        working-directory: app
        run: |
          npm init -y
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/app@8
          npx cap init "${{ inputs.app_name }}" "${{ inputs.app_id }}" --web-dir www
          # màu nền lúc mở app (đỡ chớp trắng)
          if [ -f capacitor.config.json ]; then node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.backgroundColor='#1B271F';fs.writeFileSync(f,JSON.stringify(c,null,2))"; else sed -i "s|webDir: 'www'|webDir: 'www',\n  backgroundColor: '#1B271F'|" capacitor.config.ts; fi
          npx cap add android
          npx cap sync android
          # số phiên bản: để trống thì tự tăng theo lần chạy (+100 để không trùng số cũ)
          VC="${{ inputs.version_code }}"; if [ -z "$VC" ]; then VC=$(( ${{ github.run_number }} + 100 )); fi
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" android/app/build.gradle
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/' android/variables.gradle
          # icon + màn hình chờ: nếu zip có thư mục android-res thì chép đè vào dự án
          RES=$(find ../tmp -type d -name android-res | head -1)
          if [ -n "$RES" ]; then cp -r "$RES"/. android/app/src/main/res/; echo "Đã chép icon từ $RES"; fi
          # màn hình chờ Android 12+ nền tối
          sed -i 's|<item name="android:background">@drawable/splash</item>|&\n        <item name="windowSplashScreenBackground">#1B271F</item>|' android/app/src/main/res/values/styles.xml
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build AAB
        working-directory: app/android
        run: ./gradlew bundleRelease

      - name: Ký AAB
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          jarsigner -keystore release.jks \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            app/android/app/build/outputs/bundle/release/app-release.aab upload

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
